name: Topic hub content validation

on:
  push:
    paths:
      - "content/hubs/**"
      - "content/strings/**"
      - "content/schema/**"
      - "tools/validate_content.py"
  pull_request:
    paths:
      - "content/hubs/**"
      - "content/strings/**"
      - "content/schema/**"
      - "tools/validate_content.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate /content/hubs (strict)
        run: python tools/validate_content.py --root content --schemas content/schema --strict
