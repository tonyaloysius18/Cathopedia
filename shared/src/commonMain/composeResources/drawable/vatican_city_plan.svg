<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400">
  <rect width="460" height="400" fill="#F4EFE4"/>
  <rect x="6" y="6" width="448" height="388" rx="10" fill="none" stroke="#B8963E" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Vatican Gardens -->
  <polygon points="27.6,120 156.4,136 174.8,288 64.4,320 18.4,224" fill="#8FA37A" fill-opacity="0.55" stroke="#5F7350" stroke-width="2"/>

  <!-- Vatican Museums -->
  <rect x="138" y="56" width="119.6" height="88" fill="#D8C79A" stroke="#8A6D3B" stroke-width="2"/>

  <!-- Apostolic Palace -->
